<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>投資動向ダッシュボード</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <h1>投資動向ダッシュボード</h1>
  <nav>
    <a href="glossary.html">用語集</a>
  </nav>
</header>
<main>
  <div id="page-banner" class="page-banner" hidden>
    データを取得できませんでした。ネットワーク状況を確認し、更新ボタンで再試行してください。
  </div>
  <div class="toolbar">
    <input type="text" id="search-input" placeholder="銘柄を検索(例: トヨタ、AAPL)" />
    <button id="search-button" type="button">検索</button>
    <button id="refresh-button" type="button">更新</button>
  </div>
  <ul id="search-results" class="search-results"></ul>
  <div id="chart-range-selector" class="period-selector" role="group" aria-label="チャート表示期間">
    <button type="button" data-range="1mo">1ヶ月</button>
    <button type="button" data-range="3mo" class="active">3ヶ月</button>
    <button type="button" data-range="6mo">6ヶ月</button>
    <button type="button" data-range="1y">1年</button>
  </div>
  <div id="watchlist-grid" class="watchlist-grid"></div>
  <h2 class="section-heading">経済指標(CPI・PPI)</h2>
  <div id="econ-period-selector" class="period-selector" role="group" aria-label="経済指標の表示期間">
    <button type="button" data-months="12">1年</button>
    <button type="button" data-months="36" class="active">3年</button>
    <button type="button" data-months="60">5年</button>
    <button type="button" data-months="120">10年</button>
  </div>
  <div id="econ-grid" class="econ-grid"></div>
  <h3 class="subsection-heading">購買力平価(PPP)</h3>
  <div id="ppp-period-selector" class="period-selector" role="group" aria-label="購買力平価の表示期間">
    <button type="button" data-months="12">1年</button>
    <button type="button" data-months="36" class="active">3年</button>
    <button type="button" data-months="60">5年</button>
    <button type="button" data-months="120">10年</button>
  </div>
  <h4 class="subsection-heading">対米ドル</h4>
  <div id="ppp-grid" class="econ-grid"></div>
  <h4 class="subsection-heading">対日本円</h4>
  <div id="ppp-jpy-grid" class="econ-grid"></div>
</main>
<script type="module" src="js/dashboard.js"></script>
<script type="module" src="js/econ.js"></script>
<script type="module" src="js/ppp.js"></script>
</body>
</html>
